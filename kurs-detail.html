<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurs – Tourenführer Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FFFFFF; --paper-2:#F1F3EF; --ink:#2A2C31; --ink-soft:#50535B;
    --line:#DDE1DB; --forest:#4C9A2A; --forest-dk:#3D7A21; --trail:#58B030; --error:#B3261E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter', system-ui, sans-serif;
    font-size:16px; line-height:1.55;
    background-image: radial-gradient(circle at 1px 1px, rgba(42,44,49,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .page{ max-width:640px; margin:0 auto; padding:40px 20px 80px; }

  a.back{ font-size:13.5px; color:var(--ink-soft); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; }
  a.back:hover{ color:var(--forest-dk); border-color:var(--forest); }

  h1{
    font-family:'Fraunces', serif; font-weight:600; font-optical-sizing:auto;
    font-size:clamp(28px, 6vw, 36px); line-height:1.1; margin:16px 0 12px; color:var(--forest-dk);
  }

  .facts{
    background:#fff; border:1px solid var(--line); border-radius:3px;
    padding:18px 22px; margin-bottom:24px;
    display:grid; grid-template-columns:1fr 1fr; gap:14px 20px;
  }
  @media (max-width:480px){ .facts{ grid-template-columns:1fr; } }
  .fact dt{ font-size:12px; color:var(--trail); margin:0 0 3px; }
  .fact dd{ font-size:14.5px; margin:0; color:var(--ink); }

  .block{ margin-bottom:26px; }
  .block h2{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; color:var(--forest-dk); margin:0 0 8px; }
  .block p{ font-size:14.5px; color:var(--ink); white-space:pre-line; }

  .anmelde-box{
    background:#fff; border:1px solid var(--line); border-radius:3px; padding:26px 26px 22px; margin-top:32px;
  }
  .anmelde-box h2{ font-family:'Fraunces', serif; font-size:20px; color:var(--forest-dk); margin:0 0 4px; }
  .platz-info{ font-size:13.5px; color:var(--ink-soft); margin:0 0 20px; }
  .platz-info.frei{ color:var(--forest-dk); }
  .platz-info.voll{ color:var(--error); }

  .field{ margin-bottom:18px; }
  label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:6px; }
  label .opt{ font-weight:400; color:var(--ink-soft); }
  input[type=text], input[type=tel], input[type=email], input[type=date]{
    width:100%; font-family:inherit; font-size:15px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:2px; padding:11px 12px;
  }
  input:focus{ outline:none; border-color:var(--forest); background:#fff; }

  .radio-group{ display:flex; gap:18px; margin-top:4px; }
  .radio-group label{ display:flex; align-items:center; gap:6px; font-weight:400; font-size:14.5px; margin:0; }
  .radio-group input{ width:auto; }

  .field-error{ display:none; font-size:12.5px; color:var(--error); margin-top:5px; }
  .field.invalid input{ border-color:var(--error); }
  .field.invalid .field-error{ display:block; }

  button[type=submit]{
    font-family:'Inter', sans-serif; font-weight:600; font-size:15px; color:#fff;
    background:var(--forest); border:none; border-radius:2px; padding:13px 26px; cursor:pointer;
  }
  button[type=submit]:hover{ background:var(--forest-dk); }
  button[type=submit]:disabled{ background:var(--line); cursor:not-allowed; }

  .status-msg{ font-size:14px; margin-top:14px; display:none; }
  .status-msg.show{ display:block; }
  .status-msg.ok{ color:var(--forest-dk); }
  .status-msg.err{ color:var(--error); }

  .loading, .empty{ text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:14.5px; }
  .config-warning{
    background:#FDECEA; border:1px solid #F0B4AE; color:#8A2A22; font-size:13.5px;
    padding:12px 16px; border-radius:2px; margin-bottom:24px; display:none;
  }
  .config-warning.show{ display:block; }
</style>
</head>
<body>

<div class="page">
  <a class="back" href="index.html">← Zurück zur Übersicht</a>

  <div class="config-warning" id="configWarning">
    Firebase ist noch nicht verbunden. Trag deine Projekt-Konfiguration im Script-Block am Ende der Datei ein.
  </div>

  <div id="content">
    <p class="loading">Kurs wird geladen …</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRq4pDhR3PwPBUdV5Ekjzd8FYh25tzGks",
    authDomain: "newsletter-touren.firebaseapp.com",
    projectId: "newsletter-touren",
    storageBucket: "newsletter-touren.firebasestorage.app",
    messagingSenderId: "122590369431",
    appId: "1:122590369431:web:2f648aecc33dd0d46fbbd2"
  };

  const isConfigured = firebaseConfig.apiKey !== "DEIN_API_KEY";
  const contentEl = document.getElementById('content');
  const params = new URLSearchParams(location.search);
  const kursId = params.get('id');

  if (!isConfigured) {
    document.getElementById('configWarning').classList.add('show');
    contentEl.innerHTML = '<p class="empty">Keine Verbindung zu Firebase.</p>';
  } else if (!kursId) {
    contentEl.innerHTML = '<p class="empty">Kein Kurs angegeben.</p>';
  } else {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    ladeKurs(db, kursId);
  }

  function formatDatum(iso) {
    if (!iso) return '';
    const [j, m, t] = iso.split('-');
    return `${t}.${m}.${j}`;
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
  function berechneAlter(geburtsdatum) {
    const heute = new Date();
    const geb = new Date(geburtsdatum);
    let alter = heute.getFullYear() - geb.getFullYear();
    const m = heute.getMonth() - geb.getMonth();
    if (m < 0 || (m === 0 && heute.getDate() < geb.getDate())) alter--;
    return alter;
  }

  async function ladeKurs(db, id) {
    try {
      const doc = await db.collection('kurse').doc(id).get();
      if (!doc.exists) {
        contentEl.innerHTML = '<p class="empty">Dieser Kurs wurde nicht gefunden.</p>';
        return;
      }
      render(db, { id: doc.id, ...doc.data() });
    } catch (err) {
      console.error(err);
      contentEl.innerHTML = '<p class="empty">Fehler beim Laden: ' + err.message + '</p>';
    }
  }

  function render(db, kurs) {
    const hatKapazitaet = !!kurs.maxTeilnehmer;
    const bestaetigt = kurs.bestaetigtAnzahl || 0;
    const frei = hatKapazitaet ? kurs.maxTeilnehmer - bestaetigt : null;
    const istVoll = hatKapazitaet && frei <= 0;

    const platzText = !hatKapazitaet
      ? ''
      : istVoll
        ? `<p class="platz-info voll">Alle Plätze vergeben – Anmeldung landet auf der Warteliste.</p>`
        : `<p class="platz-info frei">${frei} von ${kurs.maxTeilnehmer} Plätzen frei</p>`;

    contentEl.innerHTML = `
      <h1>${escapeHtml(kurs.titel)}</h1>

      <dl class="facts">
        ${kurs.datum ? `<div class="fact"><dt>Datum</dt><dd>${formatDatum(kurs.datum)}</dd></div>` : ''}
        ${kurs.ort ? `<div class="fact"><dt>Ort</dt><dd>${escapeHtml(kurs.ort)}</dd></div>` : ''}
        ${(kurs.zeitVon || kurs.zeitBis) ? `<div class="fact"><dt>Uhrzeit</dt><dd>${kurs.zeitVon || ''}${kurs.zeitVon && kurs.zeitBis ? ' – ' : ''}${kurs.zeitBis || ''} Uhr</dd></div>` : ''}
        ${kurs.dauer ? `<div class="fact"><dt>Kursdauer</dt><dd>${escapeHtml(kurs.dauer)}</dd></div>` : ''}
        ${kurs.mindestalter ? `<div class="fact"><dt>Mindestalter</dt><dd>${kurs.mindestalter} Jahre</dd></div>` : ''}
        <div class="fact"><dt>Kosten Mitglieder</dt><dd>${kurs.kostenMitglied ? kurs.kostenMitglied + ' €' : 'kostenlos'}</dd></div>
        <div class="fact"><dt>Kosten Nicht-Mitglieder</dt><dd>${kurs.kostenNichtmitglied ? kurs.kostenNichtmitglied + ' €' : 'kostenlos'}</dd></div>
      </dl>

      <div class="block">
        <h2>Beschreibung</h2>
        <p>${escapeHtml(kurs.beschreibung)}</p>
      </div>

      <div class="anmelde-box">
        <h2>Anmeldung</h2>
        ${platzText}
        <form id="anmeldeForm" novalidate>
          <div class="field" id="f-anzahlPersonen">
            <label for="anzahlPersonen">Anzahl Personen</label>
            <select id="anzahlPersonen" required>
              <option value="1" selected>1 Person</option>
              <option value="2">2 Personen</option>
              <option value="3">3 Personen</option>
              <option value="4">4 Personen</option>
              <option value="5">5 Personen</option>
            </select>
          </div>

          <div id="personenContainer"></div>

          <div class="field" id="f-telefon">
            <label for="telefon">Telefonnummer <span class="opt">(oder E-Mail unten)</span></label>
            <input type="tel" id="telefon">
          </div>
          <div class="field" id="f-email">
            <label for="email">E-Mail <span class="opt">(oder Telefon oben)</span></label>
            <input type="email" id="email">
            <p class="field-error">Bitte Telefonnummer oder E-Mail angeben.</p>
          </div>

          <button type="submit" id="submitBtn">Anmelden</button>
          <p class="status-msg" id="statusMsg"></p>
        </form>
      </div>
    `;

    renderPersonenFelder(kurs.mindestalter, 1);
    document.getElementById('anzahlPersonen').addEventListener('change', (e) => {
      renderPersonenFelder(kurs.mindestalter, parseInt(e.target.value, 10) || 1);
    });
    document.getElementById('anmeldeForm').addEventListener('submit', (e) => handleAnmeldung(e, db, kurs, hatKapazitaet));
  }

  function renderPersonenFelder(mindestalter, anzahl) {
    const container = document.getElementById('personenContainer');
    let html = '';
    for (let i = 1; i <= anzahl; i++) {
      const titel = anzahl === 1 ? 'Deine Daten' : `Person ${i}${i === 1 ? ' (du selbst)' : ''}`;
      html += `
        <div style="border-top:1px solid var(--paper-2); padding-top:16px; margin-top:${i === 1 ? '4' : '16'}px;">
          <p style="font-size:13px; font-weight:600; color:var(--trail); margin:0 0 12px;">${titel}</p>
          <div class="field" id="f-name-${i}">
            <label for="name-${i}">Name</label>
            <input type="text" id="name-${i}" required>
            <p class="field-error">Bitte Namen angeben.</p>
          </div>
          ${mindestalter ? `
          <div class="field" id="f-geburtsdatum-${i}">
            <label for="geburtsdatum-${i}">Geburtsdatum <span class="opt">(Mindestalter ${mindestalter} Jahre – wird geprüft)</span></label>
            <input type="date" id="geburtsdatum-${i}" required>
            <p class="field-error">Bitte Geburtsdatum angeben.</p>
          </div>` : `<input type="hidden" id="geburtsdatum-${i}">`}
          <div class="field" id="f-mitglied-${i}">
            <label>Mitgliedsstatus</label>
            <div class="radio-group">
              <label><input type="radio" name="mitglied-${i}" value="ja" required> Mitglied</label>
              <label><input type="radio" name="mitglied-${i}" value="nein"> Nicht-Mitglied</label>
            </div>
            <p class="field-error">Bitte Mitgliedsstatus angeben.</p>
          </div>
        </div>`;
    }
    container.innerHTML = html;
  }

  function normalizeId(str) {
    const id = (str || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    return id || 'unbekannt';
  }
  function toggleInvalid(id, invalid) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('invalid', invalid);
  }

  async function handleAnmeldung(e, db, kurs, hatKapazitaet) {
    e.preventDefault();
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.className = 'status-msg';

    const anzahlPersonen = parseInt(document.getElementById('anzahlPersonen').value, 10) || 1;
    const telefon = document.getElementById('telefon').value.trim();
    const email = document.getElementById('email').value.trim();

    let valid = true;
    toggleInvalid('f-email', !telefon && !email);
    if (!telefon && !email) valid = false;

    const personen = [];
    for (let i = 1; i <= anzahlPersonen; i++) {
      const nameEl = document.getElementById(`name-${i}`);
      const geburtsdatumEl = document.getElementById(`geburtsdatum-${i}`);
      const mitgliedEl = document.querySelector(`input[name=mitglied-${i}]:checked`);
      const name = nameEl.value.trim();
      const geburtsdatum = geburtsdatumEl.value;

      toggleInvalid(`f-name-${i}`, !name);
      toggleInvalid(`f-mitglied-${i}`, !mitgliedEl);
      if (kurs.mindestalter) toggleInvalid(`f-geburtsdatum-${i}`, !geburtsdatum);
      if (!name || !mitgliedEl || (kurs.mindestalter && !geburtsdatum)) valid = false;

      personen.push({ name, geburtsdatum: geburtsdatum || null, mitglied: mitgliedEl ? mitgliedEl.value === 'ja' : null });
    }

    if (!valid) {
      statusMsg.textContent = 'Bitte die markierten Felder ausfüllen.';
      statusMsg.classList.add('show', 'err');
      return;
    }

    // Filter nach Kursvorgabe: Mindestalter – blockiert die Anmeldung für JEDE Person einzeln
    if (kurs.mindestalter) {
      for (const p of personen) {
        const alter = berechneAlter(p.geburtsdatum);
        if (alter < kurs.mindestalter) {
          statusMsg.textContent = `Für diesen Kurs ist ein Mindestalter von ${kurs.mindestalter} Jahren erforderlich. ${p.name} ist ${alter}.`;
          statusMsg.classList.add('show', 'err');
          return;
        }
      }
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Wird gesendet …';

    try {
      const kontaktId = normalizeId(email || telefon);
      const kursRef = db.collection('kurse').doc(kurs.id);
      const anmeldungRef = kursRef.collection('anmeldungen').doc(kontaktId);

      const status = await db.runTransaction(async (tx) => {
        let neuerStatus = 'angemeldet';
        let bestaetigt = 0;
        if (hatKapazitaet) {
          const kursSnap = await tx.get(kursRef);
          bestaetigt = kursSnap.data().bestaetigtAnzahl || 0;
          neuerStatus = (bestaetigt + anzahlPersonen) <= kurs.maxTeilnehmer ? 'angemeldet' : 'warteliste';
        }

        tx.set(anmeldungRef, {
          name: personen[0].name, telefon: telefon || null, email: email || null,
          mitglied: personen[0].mitglied,
          personen,
          anzahlPersonen,
          status: neuerStatus,
          angemeldetAm: firebase.firestore.FieldValue.serverTimestamp()
        });

        if (hatKapazitaet && neuerStatus === 'angemeldet') {
          tx.update(kursRef, { bestaetigtAnzahl: bestaetigt + anzahlPersonen });
        }
        return neuerStatus;
      });

      const personText = anzahlPersonen === 1 ? '' : ` (${anzahlPersonen} Personen)`;
      statusMsg.textContent = status === 'angemeldet'
        ? `Anmeldung erfolgreich${personText} – euer Platz ist reserviert.`
        : `Anmeldung erfolgreich${personText} – ihr steht auf der Warteliste.`;
      statusMsg.classList.add('show', 'ok');
      document.getElementById('anmeldeForm').reset();
      renderPersonenFelder(kurs.mindestalter, 1);
      document.getElementById('anzahlPersonen').value = '1';
    } catch (err) {
      console.error(err);
      if (err.code === 'permission-denied') {
        statusMsg.textContent = 'Mit dieser Telefonnummer bzw. E-Mail bist du für diesen Kurs schon angemeldet.';
      } else {
        statusMsg.textContent = 'Fehler beim Anmelden: ' + err.message;
      }
      statusMsg.classList.add('show', 'err');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Anmelden';
    }
  }
</script>

</body>
</html>
