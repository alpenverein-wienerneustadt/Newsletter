<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter abmelden – Tourenführer Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F4F2EA; --paper-2:#ECE8DB; --ink:#22261F; --ink-soft:#565A4E;
    --line:#C9C4B2; --forest:#3F5A3D; --forest-dk:#2C4029; --trail:#9C6B3E; --error:#A5432E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter', system-ui, sans-serif;
    font-size:16px; line-height:1.5;
    background-image: radial-gradient(circle at 1px 1px, rgba(34,38,31,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .page{ max-width:420px; margin:0 auto; padding:60px 20px 80px; text-align:center; }
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:28px; color:var(--forest-dk); margin:0 0 10px;
  }
  .sub{ color:var(--ink-soft); font-size:14.5px; margin-bottom:26px; }
  form{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  input[type=email]{
    flex:1; min-width:200px; font-family:inherit; font-size:15px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:2px; padding:11px 12px;
  }
  input:focus{ outline:none; border-color:var(--forest); }
  button{
    font-family:'Inter', sans-serif; font-weight:600; font-size:14.5px; color:#fff;
    background:var(--forest); border:none; border-radius:2px; padding:11px 20px; cursor:pointer;
  }
  button:hover{ background:var(--forest-dk); }
  button:disabled{ background:var(--line); cursor:not-allowed; }
  .status-msg{ font-size:14px; margin-top:16px; display:none; }
  .status-msg.show{ display:block; }
  .status-msg.ok{ color:var(--forest-dk); }
  .status-msg.err{ color:var(--error); }
  a.back{ display:inline-block; margin-top:30px; font-size:13px; color:var(--ink-soft); }
  .config-warning{
    background:#FBEFE8; border:1px solid #E3B896; color:#7A4322; font-size:13.5px;
    padding:12px 16px; border-radius:2px; margin-bottom:24px; display:none; text-align:left;
  }
  .config-warning.show{ display:block; }
</style>
</head>
<body>
<div class="page">
  <h1>Newsletter abmelden</h1>
  <p class="sub">Trag deine E-Mail-Adresse ein, mit der du angemeldet bist.</p>

  <div class="config-warning" id="configWarning">
    Firebase ist noch nicht verbunden. Trag deine Projekt-Konfiguration im Script-Block am Ende der Datei ein.
  </div>

  <form id="abmeldenForm" novalidate>
    <input type="email" id="email" placeholder="deine@email.at" required>
    <button type="submit" id="submitBtn">Abmelden</button>
  </form>
  <p class="status-msg" id="statusMsg"></p>
  <a class="back" href="index.html">← Zurück zur Übersicht</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRq4pDhR3PwPBUdV5Ekjzd8FYh25tzGks",
    authDomain: "newsletter-touren.firebaseapp.com",
    projectId: "newsletter-touren",
    storageBucket: "newsletter-touren.firebasestorage.app",
    messagingSenderId: "122590369431",
    appId: "1:122590369431:web:2f648aecc33dd0d46fbbd2"
  };

  const isConfigured = firebaseConfig.apiKey !== "DEIN_API_KEY";
  let db = null;

  if (isConfigured) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } else {
    document.getElementById('configWarning').classList.add('show');
  }

  function normalizeId(str) {
    const id = (str || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    return id || 'unbekannt';
  }

  document.getElementById('abmeldenForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.className = 'status-msg';
    const email = document.getElementById('email').value.trim();
    if (!email || !isConfigured) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Wird bearbeitet …';

    try {
      const id = normalizeId(email);
      await db.collection('newsletterAbos').doc(id).set({
        email,
        status: 'abgemeldet',
        abgemeldetAm: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      statusMsg.textContent = 'Du wurdest vom Newsletter abgemeldet.';
      statusMsg.classList.add('show', 'ok');
    } catch (err) {
      console.error(err);
      statusMsg.textContent = 'Fehler: ' + err.message;
      statusMsg.classList.add('show', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Abmelden';
    }
  });
</script>
</body>
</html>
