<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounts verwalten – Tourenführer Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F4F2EA; --paper-2:#ECE8DB; --ink:#22261F; --ink-soft:#565A4E;
    --line:#C9C4B2; --forest:#3F5A3D; --forest-dk:#2C4029; --trail:#9C6B3E; --error:#A5432E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter', system-ui, sans-serif;
    font-size:16px; line-height:1.5;
    background-image: radial-gradient(circle at 1px 1px, rgba(34,38,31,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .page{ max-width:720px; margin:0 auto; padding:40px 20px 80px; }

  .eyebrow-line{ display:flex; align-items:center; gap:10px; color:var(--trail); font-size:13px; margin-bottom:10px; }
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-optical-sizing:auto;
    font-size:clamp(28px, 6vw, 36px); line-height:1.1; margin:0 0 8px; color:var(--forest-dk);
  }
  .sub{ color:var(--ink-soft); font-size:14.5px; margin-bottom:28px; }

  .auth-box{
    background:#fff; border:1px solid var(--line); border-radius:3px;
    padding:22px 24px; margin-bottom:24px; font-size:14.5px; color:var(--ink-soft);
  }
  .auth-box.err{ border-color:#E3B896; background:#FBEFE8; color:#7A4322; }
  .auth-box a{ color:var(--forest-dk); font-weight:600; }

  .group-title{
    font-family:'Fraunces', serif; font-size:18px; font-weight:600; color:var(--forest-dk);
    margin: 28px 0 12px;
  }

  .user-card{
    background:#fff; border:1px solid var(--line); border-radius:3px;
    padding:16px 18px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .user-info p{ margin:0; }
  .user-name{ font-weight:600; font-size:14.5px; }
  .user-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  .badge{ font-size:11px; padding:3px 9px; border-radius:20px; background:var(--paper-2); color:var(--ink-soft); }
  .badge.ausstehend{ background:#EFE7D0; color:#6B5A24; }
  .badge.genehmigt{ background:#E3EAE0; color:var(--forest-dk); }
  .badge.gesperrt{ background:#F3E1DB; color:#7A4322; }

  .user-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  button.action{
    font-family:'Inter', sans-serif; font-size:13px; font-weight:600;
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:2px; padding:8px 14px; cursor:pointer;
  }
  button.action.genehmigen{ background:var(--forest); border-color:var(--forest); color:#fff; }
  button.action.genehmigen:hover{ background:var(--forest-dk); }
  button.action.sperren{ background:#fff; border-color:var(--error); color:var(--error); }
  button.action.sperren:hover{ background:#FBEFE8; }
  button.action:disabled{ opacity:0.5; cursor:not-allowed; }

  .empty{ color:var(--ink-soft); font-size:14px; padding:12px 0 24px; }

  .config-warning{
    background:#FBEFE8; border:1px solid #E3B896; color:#7A4322; font-size:13.5px;
    padding:12px 16px; border-radius:2px; margin-bottom:24px; display:none;
  }
  .config-warning.show{ display:block; }
</style>
</head>
<body>

<div class="page">
  <div class="eyebrow-line">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 12L5 4L8 9L10 5L13 12" stroke="#9C6B3E" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
    Tourenführer Portal · Vorstand
  </div>
  <h1>Accounts verwalten</h1>
  <p class="sub">Tourenführer-Accounts freischalten oder sperren. <a href="dashboard.html" style="color:var(--forest-dk)">← Zur Übersicht</a></p>

  <div class="config-warning" id="configWarning">
    Firebase ist noch nicht verbunden. Trag deine Projekt-Konfiguration im Script-Block am Ende der Datei ein.
  </div>

  <div id="authGate" class="auth-box">
    <p>Anmeldestatus wird geprüft …</p>
  </div>

  <div id="content" style="display:none"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  // TODO: gleiche Config wie in den anderen Dateien eintragen
  const firebaseConfig = {
    apiKey: "AIzaSyBRq4pDhR3PwPBUdV5Ekjzd8FYh25tzGks",
    authDomain: "newsletter-touren.firebaseapp.com",
    projectId: "newsletter-touren",
    storageBucket: "newsletter-touren.firebasestorage.app",
    messagingSenderId: "122590369431",
    appId: "1:122590369431:web:2f648aecc33dd0d46fbbd2"
  };

  const isConfigured = firebaseConfig.apiKey !== "DEIN_API_KEY";
  const authGate = document.getElementById('authGate');
  const content = document.getElementById('content');
  let db = null, auth = null;

  if (isConfigured) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    auth.onAuthStateChanged(pruefeZugriff);
  } else {
    document.getElementById('configWarning').classList.add('show');
    authGate.innerHTML = '<p>Keine Verbindung zu Firebase.</p>';
  }

  async function pruefeZugriff(user) {
    if (!user) {
      authGate.className = 'auth-box';
      authGate.innerHTML = 'Bitte zuerst einloggen: <a href="login.html">Zum Login</a>';
      return;
    }
    try {
      const doc = await db.collection('users').doc(user.uid).get();
      const profil = doc.exists ? doc.data() : null;

      if (!profil || profil.rolle !== 'vorstand' || profil.status !== 'genehmigt') {
        authGate.className = 'auth-box err';
        authGate.textContent = 'Kein Zugriff – dieser Bereich ist nur für den Vorstand.';
        return;
      }

      authGate.style.display = 'none';
      content.style.display = 'block';
      ladeUsers();
    } catch (err) {
      console.error(err);
      authGate.className = 'auth-box err';
      authGate.textContent = 'Fehler beim Prüfen des Zugriffs: ' + err.message;
    }
  }

  async function ladeUsers() {
    content.innerHTML = '<p class="empty">Accounts werden geladen …</p>';
    try {
      const snap = await db.collection('users').orderBy('registriertAm', 'desc').get();
      const users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render(users);
    } catch (err) {
      console.error(err);
      content.innerHTML = '<p class="empty">Fehler beim Laden: ' + err.message + '</p>';
    }
  }

  function render(users) {
    const ausstehend = users.filter(u => u.status === 'ausstehend');
    const uebrige = users.filter(u => u.status !== 'ausstehend');

    content.innerHTML = `
      <p class="group-title">Wartet auf Freischaltung (${ausstehend.length})</p>
      <div id="listeAusstehend">${ausstehend.length ? ausstehend.map(cardHtml).join('') : '<p class="empty">Aktuell keine offenen Anfragen.</p>'}</div>

      <p class="group-title">Alle Accounts</p>
      <div id="listeUebrige">${uebrige.map(cardHtml).join('')}</div>
    `;

    document.querySelectorAll('button.action').forEach(btn => {
      btn.addEventListener('click', () => handleAction(btn.dataset.uid, btn.dataset.status));
    });
  }

  function cardHtml(u) {
    const badgeLabel = { ausstehend: 'Ausstehend', genehmigt: 'Genehmigt', gesperrt: 'Gesperrt' }[u.status] || u.status;
    return `
      <div class="user-card">
        <div class="user-info">
          <p class="user-name">${escapeHtml(u.name || u.email)}</p>
          <p class="user-meta">${escapeHtml(u.email)} · ${escapeHtml(u.rolle)} · <span class="badge ${u.status}">${badgeLabel}</span></p>
        </div>
        <div class="user-actions">
          ${u.status !== 'genehmigt' ? `<button class="action genehmigen" data-uid="${u.id}" data-status="genehmigt">Genehmigen</button>` : ''}
          ${u.status !== 'gesperrt' ? `<button class="action sperren" data-uid="${u.id}" data-status="gesperrt">Sperren</button>` : ''}
        </div>
      </div>`;
  }

  async function handleAction(uid, neuerStatus) {
    try {
      await db.collection('users').doc(uid).update({ status: neuerStatus });
      ladeUsers();
    } catch (err) {
      console.error(err);
      alert('Fehler beim Aktualisieren: ' + err.message);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
