<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour – Tourenführer Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FFFFFF; --paper-2:#F1F3EF; --ink:#2A2C31; --ink-soft:#50535B;
    --line:#DDE1DB; --forest:#4C9A2A; --forest-dk:#3D7A21; --trail:#58B030; --error:#B3261E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter', system-ui, sans-serif;
    font-size:16px; line-height:1.55;
    background-image: radial-gradient(circle at 1px 1px, rgba(42,44,49,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .page{ max-width:640px; margin:0 auto; padding:40px 20px 80px; }

  a.back{ font-size:13.5px; color:var(--ink-soft); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; }
  a.back:hover{ color:var(--forest-dk); border-color:var(--forest); }

  h1{
    font-family:'Fraunces', serif; font-weight:600; font-optical-sizing:auto;
    font-size:clamp(28px, 6vw, 36px); line-height:1.1; margin:16px 0 12px; color:var(--forest-dk);
  }

  .meta-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .tag{ font-size:12px; padding:3px 10px; border-radius:20px; background:var(--paper-2); color:var(--ink-soft); }
  .tag.schwierigkeit-schwer{ background:#F3E1DB; color:#8A2A22; }
  .tag.schwierigkeit-mittel{ background:#EFE7D0; color:#6B5A24; }
  .tag.schwierigkeit-leicht{ background:#E3EAE0; color:var(--forest-dk); }

  .facts{
    background:#fff; border:1px solid var(--line); border-radius:3px;
    padding:18px 22px; margin-bottom:24px;
    display:grid; grid-template-columns:1fr 1fr; gap:14px 20px;
  }
  @media (max-width:480px){ .facts{ grid-template-columns:1fr; } }
  .fact dt{ font-size:12px; color:var(--trail); margin:0 0 3px; text-transform:none; }
  .fact dd{ font-size:14.5px; margin:0; color:var(--ink); }

  .block{ margin-bottom:26px; }
  .block h2{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; color:var(--forest-dk); margin:0 0 8px; }
  .block p{ font-size:14.5px; color:var(--ink); white-space:pre-line; }

  /* --- Anmeldung --- */
  .anmelde-box{
    background:#fff; border:1px solid var(--line); border-radius:3px; padding:26px 26px 22px; margin-top:32px;
  }
  .anmelde-box h2{ font-family:'Fraunces', serif; font-size:20px; color:var(--forest-dk); margin:0 0 4px; }
  .platz-info{ font-size:13.5px; color:var(--ink-soft); margin:0 0 20px; }
  .platz-info.frei{ color:var(--forest-dk); }
  .platz-info.voll{ color:var(--error); }

  .field{ margin-bottom:18px; }
  label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:6px; }
  label .opt{ font-weight:400; color:var(--ink-soft); }
  input[type=text], input[type=tel], input[type=email]{
    width:100%; font-family:inherit; font-size:15px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:2px; padding:11px 12px;
  }
  input:focus{ outline:none; border-color:var(--forest); background:#fff; }

  .radio-group{ display:flex; gap:18px; margin-top:4px; }
  .radio-group label{ display:flex; align-items:center; gap:6px; font-weight:400; font-size:14.5px; margin:0; }
  .radio-group input{ width:auto; }

  .field-error{ display:none; font-size:12.5px; color:var(--error); margin-top:5px; }
  .field.invalid input{ border-color:var(--error); }
  .field.invalid .field-error{ display:block; }

  button[type=submit]{
    font-family:'Inter', sans-serif; font-weight:600; font-size:15px; color:#fff;
    background:var(--forest); border:none; border-radius:2px; padding:13px 26px; cursor:pointer;
  }
  button[type=submit]:hover{ background:var(--forest-dk); }
  button[type=submit]:disabled{ background:var(--line); cursor:not-allowed; }

  .status-msg{ font-size:14px; margin-top:14px; display:none; }
  .status-msg.show{ display:block; }
  .status-msg.ok{ color:var(--forest-dk); }
  .status-msg.err{ color:var(--error); }

  .loading, .empty{ text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:14.5px; }
  .config-warning{
    background:#FDECEA; border:1px solid #F0B4AE; color:#8A2A22; font-size:13.5px;
    padding:12px 16px; border-radius:2px; margin-bottom:24px; display:none;
  }
  .config-warning.show{ display:block; }

  .kapazitaet-modal{
    display:none; position:fixed; inset:0; background:rgba(42,44,49,0.72); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .kapazitaet-modal.show{ display:flex; }
  .kapazitaet-modal-inner{
    background:#fff; border-radius:4px; padding:24px; max-width:400px; width:100%;
  }
  .kapazitaet-modal h3{ font-family:'Fraunces', serif; font-size:18px; color:var(--forest-dk); margin:0 0 10px; }
  .kapazitaet-option{
    text-align:left; font-family:'Inter', sans-serif; font-size:14px; font-weight:600;
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:2px; padding:12px 14px; cursor:pointer;
  }
  .kapazitaet-option:hover{ border-color:var(--forest); background:#fff; }
  .kapazitaet-option .beschreibung{ display:block; font-size:12.5px; font-weight:400; color:var(--ink-soft); margin-top:3px; }
  .kapazitaet-option.betont{ background:var(--forest); border-color:var(--forest); color:#fff; }
  .kapazitaet-option.betont .beschreibung{ color:rgba(255,255,255,0.85); }
  .kapazitaet-option.betont:hover{ background:var(--forest-dk); }
</style>
</head>
<body>

<div class="page">
  <a class="back" href="index.html">← Zurück zur Übersicht</a>

  <div class="config-warning" id="configWarning">
    Firebase ist noch nicht verbunden. Trag deine Projekt-Konfiguration im Script-Block am Ende der Datei ein.
  </div>

  <div id="content">
    <p class="loading">Tour wird geladen …</p>
  </div>
</div>

<div id="kapazitaetModal" class="kapazitaet-modal">
  <div class="kapazitaet-modal-inner">
    <h3>Nicht genug Plätze frei</h3>
    <p id="kapazitaetText" style="font-size:14px; color:var(--ink); margin:0 0 18px;"></p>
    <div id="kapazitaetOptionen" style="display:flex; flex-direction:column; gap:10px;"></div>
    <button type="button" id="kapazitaetAbbrechen" style="margin-top:14px; background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; text-decoration:underline;">Abbrechen</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  // TODO: gleiche Config wie in tour-anlegen.html / index.html eintragen
  const firebaseConfig = {
    apiKey: "AIzaSyBRq4pDhR3PwPBUdV5Ekjzd8FYh25tzGks",
    authDomain: "newsletter-touren.firebaseapp.com",
    projectId: "newsletter-touren",
    storageBucket: "newsletter-touren.firebasestorage.app",
    messagingSenderId: "122590369431",
    appId: "1:122590369431:web:2f648aecc33dd0d46fbbd2"
  };

  const isConfigured = firebaseConfig.apiKey !== "DEIN_API_KEY";
  const contentEl = document.getElementById('content');

  const DISZIPLIN_LABEL = {
    wandern:'Wandern', klettersteig:'Klettersteig', klettertour:'Klettertour',
    hochtour:'Hochtour', schitour:'Schitour', schneeschuh:'Schneeschuh', mountainbike:'Mountainbike'
  };

  const params = new URLSearchParams(location.search);
  const tourId = params.get('id');

  if (!isConfigured) {
    document.getElementById('configWarning').classList.add('show');
    contentEl.innerHTML = '<p class="empty">Keine Verbindung zu Firebase.</p>';
  } else if (!tourId) {
    contentEl.innerHTML = '<p class="empty">Keine Tour angegeben.</p>';
  } else {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    ladeTour(db, tourId);
  }

  function formatDatum(iso) {
    if (!iso) return '';
    const [j, m, t] = iso.split('-');
    return `${t}.${m}.${j}`;
  }
  function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  async function ladeTour(db, id) {
    try {
      const doc = await db.collection('touren').doc(id).get();
      if (!doc.exists) {
        contentEl.innerHTML = '<p class="empty">Diese Tour wurde nicht gefunden.</p>';
        return;
      }
      const tour = { id: doc.id, ...doc.data() };
      render(db, tour);
    } catch (err) {
      console.error(err);
      contentEl.innerHTML = '<p class="empty">Fehler beim Laden: ' + err.message + '</p>';
    }
  }

  function render(db, tour) {
    const bestaetigt = tour.bestaetigtAnzahl || 0;
    const reserviert = tour.reserviertAnzahl || 0;
    const frei = tour.maxTeilnehmer - bestaetigt - reserviert;
    const istVoll = frei <= 0;

    const platzText = istVoll
      ? `<p class="platz-info voll">Alle Plätze vergeben – Anmeldung landet auf der Warteliste.</p>`
      : `<p class="platz-info frei">${frei} von ${tour.maxTeilnehmer} Plätzen frei</p>`;

    contentEl.innerHTML = `
      <h1>${escapeHtml(tour.titel)}</h1>
      <div class="meta-row">
        <span class="tag">${DISZIPLIN_LABEL[tour.disziplin] || tour.disziplin}</span>
        <span class="tag schwierigkeit-${tour.schwierigkeit}">${capitalize(tour.schwierigkeit)}</span>
      </div>

      <dl class="facts">
        <div class="fact"><dt>Datum</dt><dd>${formatDatum(tour.datum)}${tour.datumEnde ? ' – ' + formatDatum(tour.datumEnde) : ''}</dd></div>
        <div class="fact"><dt>Treffpunkt</dt><dd>${escapeHtml(tour.treffpunkt)}${tour.treffzeit ? ' um ' + escapeHtml(tour.treffzeit) + ' Uhr' : ''}</dd></div>
        <div class="fact"><dt>Anmeldeschluss</dt><dd>${tour.anmeldeschluss ? formatDatum(tour.anmeldeschluss) : '–'}</dd></div>
        <div class="fact"><dt>Kosten Mitglieder</dt><dd>${tour.kostenMitglied ? tour.kostenMitglied + ' €' : 'kostenlos'}</dd></div>
        <div class="fact"><dt>Kosten Nicht-Mitglieder</dt><dd>${tour.kostenNichtmitglied ? tour.kostenNichtmitglied + ' €' : 'kostenlos'}</dd></div>
      </dl>

      <div class="block">
        <h2>Beschreibung</h2>
        <p>${escapeHtml(tour.beschreibung)}</p>
      </div>

      ${tour.ausruestung ? `
      <div class="block">
        <h2>Mitzubringende Ausrüstung</h2>
        <p>${escapeHtml(tour.ausruestung)}</p>
      </div>` : ''}

      ${tour.besonderheiten && tour.besonderheiten.length ? `
      <div class="block">
        <h2>Besonderheiten</h2>
        <div class="meta-row">
          ${tour.besonderheiten.map(b => `<span class="tag">${escapeHtml(b)}</span>`).join('')}
        </div>
      </div>` : ''}

      <div class="block">
        <h2>Tourenführer:in</h2>
        <p>${escapeHtml(tour.erstelltVon)}</p>
        <p>
          ${tour.kontaktTelefon ? `Tel.: <a href="tel:${escapeHtml(tour.kontaktTelefon)}" style="color:var(--forest-dk);">${escapeHtml(tour.kontaktTelefon)}</a><br>` : ''}
          ${tour.kontaktEmail ? `E-Mail: <a href="mailto:${escapeHtml(tour.kontaktEmail)}" style="color:var(--forest-dk);">${escapeHtml(tour.kontaktEmail)}</a><br>` : ''}
          ${tour.kontaktWhatsapp ? `WhatsApp: <a href="https://wa.me/${escapeHtml(tour.kontaktWhatsapp.replace(/[^0-9+]/g, ''))}" target="_blank" rel="noopener" style="color:var(--forest-dk);">${escapeHtml(tour.kontaktWhatsapp)}</a>` : ''}
        </p>
      </div>

      <div class="anmelde-box">
        <h2>Anmeldung</h2>
        ${platzText}
        <form id="anmeldeForm" novalidate>
          <div class="field" id="f-anzahlPersonen">
            <label for="anzahlPersonen">Anzahl Personen</label>
            <select id="anzahlPersonen" required>
              <option value="1" selected>1 Person</option>
              <option value="2">2 Personen</option>
              <option value="3">3 Personen</option>
              <option value="4">4 Personen</option>
              <option value="5">5 Personen</option>
            </select>
          </div>

          <div id="personenContainer"></div>

          <div class="field" id="f-telefon">
            <label for="telefon">Telefonnummer <span class="opt">(oder E-Mail unten)</span></label>
            <input type="tel" id="telefon">
          </div>
          <div class="field" id="f-email">
            <label for="email">E-Mail <span class="opt">(oder Telefon oben)</span></label>
            <input type="email" id="email">
            <p class="field-error">Bitte Telefonnummer oder E-Mail angeben.</p>
          </div>

          <button type="submit" id="submitBtn">${istVoll ? 'Auf Warteliste anmelden' : 'Verbindlich anmelden'}</button>
          <p class="status-msg" id="statusMsg"></p>
        </form>
      </div>
    `;

    renderPersonenFelder(1);
    document.getElementById('anzahlPersonen').addEventListener('change', (e) => {
      renderPersonenFelder(parseInt(e.target.value, 10) || 1);
    });
    document.getElementById('anmeldeForm').addEventListener('submit', (e) => handleAnmeldung(e, db, tour));
  }

  function renderPersonenFelder(anzahl) {
    const container = document.getElementById('personenContainer');
    let html = '';
    for (let i = 1; i <= anzahl; i++) {
      const titel = anzahl === 1 ? 'Deine Daten' : `Person ${i}${i === 1 ? ' (du selbst)' : ''}`;
      html += `
        <div style="border-top:1px solid var(--paper-2); padding-top:16px; margin-top:${i === 1 ? '4' : '16'}px;">
          <p style="font-size:13px; font-weight:600; color:var(--trail); margin:0 0 12px;">${titel}</p>
          <div class="field" id="f-name-${i}">
            <label for="name-${i}">Name</label>
            <input type="text" id="name-${i}" required>
            <p class="field-error">Bitte Namen angeben.</p>
          </div>
          <div class="field" id="f-mitglied-${i}">
            <label>Mitgliedsstatus</label>
            <div class="radio-group">
              <label><input type="radio" name="mitglied-${i}" value="ja" required> Mitglied</label>
              <label><input type="radio" name="mitglied-${i}" value="nein"> Nicht-Mitglied</label>
            </div>
            <p class="field-error">Bitte Mitgliedsstatus angeben.</p>
          </div>
        </div>`;
    }
    container.innerHTML = html;
  }

  async function handleAnmeldung(e, db, tour) {
    e.preventDefault();
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.className = 'status-msg';

    const anzahlPersonen = parseInt(document.getElementById('anzahlPersonen').value, 10) || 1;
    const telefon = document.getElementById('telefon').value.trim();
    const email = document.getElementById('email').value.trim();

    let valid = true;
    toggleInvalid('f-email', !telefon && !email);
    if (!telefon && !email) valid = false;

    for (let i = 1; i <= anzahlPersonen; i++) {
      const nameEl = document.getElementById(`name-${i}`);
      const mitgliedEl = document.querySelector(`input[name=mitglied-${i}]:checked`);
      toggleInvalid(`f-name-${i}`, !nameEl.value.trim());
      toggleInvalid(`f-mitglied-${i}`, !mitgliedEl);
      if (!nameEl.value.trim() || !mitgliedEl) valid = false;
    }

    if (!valid) {
      statusMsg.textContent = 'Bitte die markierten Felder ausfüllen.';
      statusMsg.classList.add('show', 'err');
      return;
    }

    // Vorab-Prüfung: aktuelle Kapazität frisch abfragen (öffentliche Zählerfelder, keine Anmeldedaten)
    try {
      const frischeTour = (await db.collection('touren').doc(tour.id).get()).data();
      const bestaetigt = frischeTour.bestaetigtAnzahl || 0;
      const reserviert = frischeTour.reserviertAnzahl || 0;
      const wartelisteVorhanden = (frischeTour.wartelisteAnzahl || 0) > 0;
      const frei = tour.maxTeilnehmer - bestaetigt - reserviert;

      if (anzahlPersonen <= frei) {
        fuehreAnmeldungAus(db, tour, null);
      } else {
        zeigeKapazitaetsDialog(db, tour, frei, anzahlPersonen, wartelisteVorhanden);
      }
    } catch (err) {
      console.error(err);
      statusMsg.textContent = 'Fehler: ' + err.message;
      statusMsg.classList.add('show', 'err');
    }
  }

  function zeigeKapazitaetsDialog(db, tour, frei, anzahlPersonen, wartelisteVorhanden) {
    const modal = document.getElementById('kapazitaetModal');
    document.getElementById('kapazitaetText').textContent =
      frei > 0
        ? `Nur noch ${frei} von ${anzahlPersonen} angefragten Plätzen frei.`
        : `Alle Plätze sind bereits vergeben.`;

    let optionenHtml = '';
    if (frei > 0) {
      optionenHtml += `
        <button type="button" class="kapazitaet-option" id="optAnzahlAendern">
          Anzahl auf ${frei} ändern
          <span class="beschreibung">Formular bleibt offen, du kannst die Auswahl anpassen</span>
        </button>`;
    }
    optionenHtml += `
      <button type="button" class="kapazitaet-option" id="optWarteliste">
        Ganze Gruppe auf die Warteliste
        <span class="beschreibung">Rückt automatisch nach, sobald Plätze frei werden</span>
      </button>`;

    if (!wartelisteVorhanden) {
      optionenHtml += `
        <button type="button" class="kapazitaet-option betont" id="optAnfrage">
          Tourenführer:in kontaktieren
          <span class="beschreibung">Plätze werden vorgemerkt, bis Tourenführer:in entscheidet</span>
        </button>`;
    } else {
      optionenHtml += `
        <p style="font-size:12.5px; color:var(--ink-soft); margin:4px 0 0;">
          Es stehen bereits Personen auf der Warteliste – bitte zuerst dort anmelden. Der/die Tourenführer:in kontaktiert die Warteliste, falls Plätze frei werden.
        </p>`;
    }

    optionenHtml += `
      <button type="button" class="kapazitaet-option" id="optAndereTour">
        An einer anderen Tour teilnehmen
        <span class="beschreibung">Zeigt Touren derselben Kategorie mit genug freien Plätzen</span>
      </button>`;

    document.getElementById('kapazitaetOptionen').innerHTML = optionenHtml;
    modal.classList.add('show');

    const schliessen = () => modal.classList.remove('show');
    document.getElementById('kapazitaetAbbrechen').onclick = schliessen;

    const anzahlBtn = document.getElementById('optAnzahlAendern');
    if (anzahlBtn) anzahlBtn.onclick = () => {
      document.getElementById('anzahlPersonen').value = String(frei);
      renderPersonenFelder(frei);
      schliessen();
    };

    document.getElementById('optWarteliste').onclick = () => {
      schliessen();
      fuehreAnmeldungAus(db, tour, 'warteliste');
    };

    const anfrageBtn = document.getElementById('optAnfrage');
    if (anfrageBtn) anfrageBtn.onclick = () => {
      schliessen();
      fuehreAnmeldungAus(db, tour, 'anfrage');
    };

    document.getElementById('optAndereTour').onclick = () => zeigeAndereTourenVorschlaege(db, tour, anzahlPersonen);
  }

  async function zeigeAndereTourenVorschlaege(db, tour, anzahlPersonen) {
    const container = document.getElementById('kapazitaetOptionen');
    container.innerHTML = '<p style="font-size:13.5px; color:var(--ink-soft);">Wird gesucht …</p>';
    document.getElementById('kapazitaetText').textContent = 'Andere Touren derselben Kategorie:';

    try {
      const heute = new Date().toISOString().slice(0, 10);
      const snap = await db.collection('touren')
        .where('status', '==', 'geplant')
        .where('disziplin', '==', tour.disziplin)
        .get();

      const vorschlaege = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(t => t.id !== tour.id && t.datum >= heute)
        .map(t => ({ ...t, frei: t.maxTeilnehmer - (t.bestaetigtAnzahl || 0) - (t.reserviertAnzahl || 0) }))
        .filter(t => t.frei >= anzahlPersonen)
        .sort((a, b) => (a.datum || '').localeCompare(b.datum || ''));

      if (!vorschlaege.length) {
        container.innerHTML = `
          <p style="font-size:13.5px; color:var(--ink-soft);">Keine andere Tour dieser Kategorie mit genug freien Plätzen gefunden.</p>
          <button type="button" class="kapazitaet-option" id="optZurueck">← Zurück zur Auswahl</button>`;
      } else {
        container.innerHTML = vorschlaege.map(t => `
          <a class="kapazitaet-option" href="tour-detail.html?id=${t.id}" style="display:block; text-decoration:none;">
            ${escapeHtml(t.titel)} – ${formatDatum(t.datum)}
            <span class="beschreibung">${t.frei} von ${t.maxTeilnehmer} Plätzen frei</span>
          </a>`).join('') + `<button type="button" class="kapazitaet-option" id="optZurueck">← Zurück zur Auswahl</button>`;
      }

      const zurueckBtn = document.getElementById('optZurueck');
      if (zurueckBtn) zurueckBtn.onclick = () => {
        const bestaetigt = tour.bestaetigtAnzahl || 0;
        const reserviert = tour.reserviertAnzahl || 0;
        const frei = tour.maxTeilnehmer - bestaetigt - reserviert;
        const wartelisteVorhanden = (tour.wartelisteAnzahl || 0) > 0;
        zeigeKapazitaetsDialog(db, tour, frei, anzahlPersonen, wartelisteVorhanden);
      };
    } catch (err) {
      container.innerHTML = '<p style="font-size:13.5px; color:var(--error);">Fehler beim Suchen: ' + err.message + '</p>';
    }
  }

  async function fuehreAnmeldungAus(db, tour, modus) {
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.className = 'status-msg';

    const anzahlPersonen = parseInt(document.getElementById('anzahlPersonen').value, 10) || 1;
    const telefon = document.getElementById('telefon').value.trim();
    const email = document.getElementById('email').value.trim();
    const personen = [];
    for (let i = 1; i <= anzahlPersonen; i++) {
      const mitgliedEl = document.querySelector(`input[name=mitglied-${i}]:checked`);
      personen.push({
        name: document.getElementById(`name-${i}`).value.trim(),
        mitglied: mitgliedEl ? mitgliedEl.value === 'ja' : null
      });
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Wird gesendet …';

    try {
      const kontaktId = normalizeId(email || telefon);
      const tourRef = db.collection('touren').doc(tour.id);
      const anmeldungRef = tourRef.collection('anmeldungen').doc(kontaktId);

      const neuerStatus = await db.runTransaction(async (tx) => {
        const snap = await tx.get(tourRef);
        const d = snap.data();
        const bestaetigt = d.bestaetigtAnzahl || 0;
        const reserviert = d.reserviertAnzahl || 0;
        const wartelisteAnzahl = d.wartelisteAnzahl || 0;
        const frei = d.maxTeilnehmer - bestaetigt - reserviert;

        let status;
        if (modus === 'warteliste') status = 'warteliste';
        else if (modus === 'anfrage') status = 'anfrage';
        else status = anzahlPersonen <= frei ? 'bestätigt' : 'warteliste';

        tx.set(anmeldungRef, {
          name: personen[0].name, telefon: telefon || null, email: email || null,
          mitglied: personen[0].mitglied,
          personen,
          anzahlPersonen,
          status,
          angemeldetAm: firebase.firestore.FieldValue.serverTimestamp()
        });

        if (status === 'bestätigt') {
          tx.update(tourRef, { bestaetigtAnzahl: bestaetigt + anzahlPersonen });
        } else if (status === 'warteliste') {
          tx.update(tourRef, { wartelisteAnzahl: wartelisteAnzahl + anzahlPersonen });
        } else if (status === 'anfrage') {
          tx.update(tourRef, { reserviertAnzahl: reserviert + anzahlPersonen });
        }
        return status;
      });

      const personText = anzahlPersonen === 1 ? '' : ` (${anzahlPersonen} Personen)`;
      const meldungen = {
        'bestätigt': `Anmeldung erfolgreich${personText} – euer Platz ist reserviert.`,
        'warteliste': `Anmeldung erfolgreich${personText} – ihr steht auf der Warteliste.`,
        'anfrage': `Anfrage gesendet${personText} – die Plätze sind für euch vorgemerkt, bis der/die Tourenführer:in entscheidet.`
      };
      statusMsg.textContent = meldungen[neuerStatus];
      statusMsg.classList.add('show', 'ok');
      document.getElementById('anmeldeForm').reset();
      renderPersonenFelder(1);
    } catch (err) {
      console.error(err);
      if (err.code === 'permission-denied') {
        statusMsg.textContent = 'Mit dieser Telefonnummer bzw. E-Mail bist du für diese Tour schon angemeldet.';
      } else {
        statusMsg.textContent = 'Fehler beim Anmelden: ' + err.message;
      }
      statusMsg.classList.add('show', 'err');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Verbindlich anmelden';
    }
  }

  function toggleInvalid(id, invalid) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('invalid', invalid);
  }

  function normalizeId(str) {
    const id = (str || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    return id || 'unbekannt';
  }
</script>
